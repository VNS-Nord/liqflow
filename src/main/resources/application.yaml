spring:
  application:
    name: liqflow

  datasource:
    url: jdbc:postgresql://localhost:5432/liqflow?reWriteBatchedInserts=true&prepareThreshold=5
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: LiqFlowHikariCP
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 15000
      max-lifetime: 1140000
      idle-timeout: 0
      leak-detection-threshold: 3000

  jpa:
    open-in-view: false
    show-sql: true

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true