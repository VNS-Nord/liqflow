spring:
  application:
    name: liqflow

  datasource:
    url: jdbc:postgresql://localhost:5432/liqflow
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Schemą kuria Flyway, todėl JPA tik patikrina suderinamumą
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true